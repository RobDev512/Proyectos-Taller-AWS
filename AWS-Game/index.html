<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AWS Arcade Game</title>
  <link rel="icon" href="data:,"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="gameWrapper">

  <canvas id="gameCanvas" width="600" height="700">
    Tu navegador no soporta HTML5 Canvas.
  </canvas>

  <!-- Game Over -->
  <div id="gameOverOverlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
    <div id="gameOverCard">
      <h1 id="gameOverTitle">Game Over</h1>
      <div class="gameover-scores">
        <div class="gameover-score-item">
          <span class="gameover-label">Tu puntaje</span>
          <span id="finalScore" class="gameover-value">0</span>
        </div>
        <div class="gameover-score-item">
          <span class="gameover-label">Récord</span>
          <span id="finalHighScore" class="gameover-value">0</span>
        </div>
      </div>
      <div class="gameover-level">Nivel alcanzado: <strong id="finalLevel">1</strong></div>
      <button id="playAgainBtn" type="button">Play Again</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div id="settingsCard">
      <h2 id="settingsTitle">⚙ Configuración</h2>
      <div class="settings-section">
        <p class="settings-label">Dificultad</p>
        <div id="difficultyPicker">
          <button class="diff-btn" data-diff="easy">
            <span class="diff-emoji">☁️</span>
            <span class="diff-name">Easy</span>
            <span class="diff-desc">Empieza tranquilo… el disco aprende</span>
          </button>
          <button class="diff-btn" data-diff="medium">
            <span class="diff-emoji">⚡</span>
            <span class="diff-name">Medium</span>
            <span class="diff-desc">Inversiones que se vuelven más frecuentes</span>
          </button>
          <button class="diff-btn" data-diff="hard">
            <span class="diff-emoji">🔥</span>
            <span class="diff-name">Hard</span>
            <span class="diff-desc">Caos creciente. Cada flecha cuenta</span>
          </button>
        </div>
      </div>
      <div class="settings-section">
        <p class="settings-label">Opciones</p>
        <div class="settings-toggle-row">
          <span class="settings-toggle-label">🔊 Efectos de sonido</span>
          <button id="soundToggle" class="toggle-btn on" aria-pressed="true"></button>
        </div>
        <div class="settings-toggle-row">
          <span class="settings-toggle-label">🎯 Combo multiplier</span>
          <button id="comboToggle" class="toggle-btn on" aria-pressed="true"></button>
        </div>
        <div class="settings-toggle-row">
          <span class="settings-toggle-label">✨ Efectos visuales</span>
          <button id="fxToggle" class="toggle-btn on" aria-pressed="true"></button>
        </div>
      </div>

      <div class="settings-section stats-section">
        <p class="settings-label">Estadísticas locales</p>
        <div class="stats-grid">
          <div class="stat-card"><span id="gamesPlayedStat" class="stat-value">0</span><span class="stat-name">Partidas</span></div>
          <div class="stat-card"><span id="accuracyStat" class="stat-value">0%</span><span class="stat-name">Precisión</span></div>
          <div class="stat-card"><span id="perfectShotsStat" class="stat-value">0</span><span class="stat-name">Perfects</span></div>
          <div class="stat-card"><span id="bestComboStat" class="stat-value">×1</span><span class="stat-name">Mejor combo</span></div>
          <div class="stat-card"><span id="bestLevelStat" class="stat-value">1</span><span class="stat-name">Mejor nivel</span></div>
          <div class="stat-card"><span id="levelsCompletedStat" class="stat-value">0</span><span class="stat-name">Niveles</span></div>
        </div>
      </div>
      <div class="settings-actions">
        <button id="settingsApplyBtn" type="button">Aplicar y reiniciar</button>
        <button id="settingsCloseBtn" type="button" class="btn-secondary">Cerrar</button>
      </div>
      <p id="versionLabel" class="version-label"></p>
    </div>
  </div>

</div>
<script type="module" src="main.js"></script>
</body>
</html>
